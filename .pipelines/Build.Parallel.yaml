# PR-validation pipeline, "many-agents" variant.
#
# Alternative to Build.yaml. Instead of one sequential Build-and-Test job, the work is split
# into three stages that fan out across build agents:
#   * Build    – compile + publish a 'build_output' artifact, alongside a parallel Bicep-validate job
#   * Analyze  – runs analyzers on its own agent, independent of Build (dependsOn: [])
#   * Test     – downloads the artifact and runs the tests without recompiling
# NuGet packages are cached between runs. See templates/build-steps-parallel.yaml and
# templates/test-steps.yaml.
trigger: none
pr:
  - master

pool:
  vmImage: 'ubuntu-latest'

name: $(Date:yyyyMMdd)$(Rev:.r)

variables:
  - name: BuildConfiguration
    value: 'release'
  - name: NUGET_PACKAGES
    value: $(Pipeline.Workspace)/.nuget/packages
  - template: templates/dataverse/variables.yaml

  ###########################################################################################
  #######################################    BUILD    #######################################
  ###########################################################################################
stages:
  - stage: Build_Application
    displayName: Build
    variables:
      - group: Dev
    jobs:
      - job: Build
        displayName: Build
        pool:
          vmImage: "windows-latest"
        steps:
          - template: templates/build-steps-parallel.yaml

      - job: Validate_Bicep
        displayName: Validate Bicep
        pool:
          vmImage: "windows-latest"
        steps:
          - task: PowerShell@2
            displayName: Validate Main Bicep file
            inputs:
              targetType: inline
              script: 'az bicep build --file $(System.DefaultWorkingDirectory)/Infrastructure/main.bicep'
          - template: templates/azure/validate-infrastructure.yaml

  ###########################################################################################
  #####################################    ANALYZE    #######################################
  ###########################################################################################
  - stage: Analyze_Application
    displayName: Analyze
    dependsOn: []
    variables:
      - group: Dev
    jobs:
      - job: Analyze
        displayName: Analyze
        pool:
          vmImage: "windows-latest"
        steps:
          - template: templates/build-steps-parallel.yaml
            parameters:
              runAnalyzers: true
              publishArtifact: false

  ###########################################################################################
  #######################################    TEST    ########################################
  ###########################################################################################
  - stage: Test_Application
    displayName: Test
    dependsOn: Build_Application
    variables:
      - group: Dev
    jobs:
      - job: Test
        displayName: Test
        pool:
          vmImage: "windows-latest"
        # Single test job. To shard the run across several agents, replace this job with a
        # matrix strategy — each entry runs on its own agent with a different testFilter.
        # Shards 1..n use positive (~) filters; add a catch-all "Rest" shard whose negated
        # (!~) filters mirror every ~ token so new namespaces are never skipped:
        #   strategy:
        #     matrix:
        #       Economy:
        #         testFilter: 'FullyQualifiedName~IntegrationTests.EconomyArea'
        #       Rest:
        #         testFilter: 'FullyQualifiedName!~IntegrationTests.EconomyArea'
        # then forward the per-shard value below: testFilter: $(testFilter)
        steps:
          - template: templates/test-steps.yaml
